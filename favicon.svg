<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel gamepad, white on a black tile so it shows on light and dark tab bars -->
  <rect width="16" height="16" rx="3" fill="#000"/>
  <g fill="#fff">
    <rect x="2" y="4" width="12" height="1"/>
    <rect x="1" y="5" width="14" height="5"/>
    <rect x="1" y="10" width="5" height="1"/>
    <rect x="10" y="10" width="5" height="1"/>
    <rect x="1" y="11" width="4" height="1"/>
    <rect x="11" y="11" width="4" height="1"/>
  </g>
  <g fill="#000">
    <!-- d-pad -->
    <rect x="4" y="6" width="1" height="3"/>
    <rect x="3" y="7" width="3" height="1"/>
    <!-- A and B buttons -->
    <rect x="11" y="6" width="1" height="1"/>
    <rect x="12" y="8" width="1" height="1"/>
  </g>
</svg>
